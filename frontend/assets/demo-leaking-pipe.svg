<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" aria-label="Simulated leaking municipal water pipe illustration">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5868" />
      <stop offset="30%" stop-color="#7B8C9E" />
      <stop offset="70%" stop-color="#3A4756" />
      <stop offset="100%" stop-color="#222B35" />
    </linearGradient>
    <linearGradient id="flangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#607184" />
      <stop offset="50%" stop-color="#93A4B8" />
      <stop offset="100%" stop-color="#2D3845" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" />
      <stop offset="50%" stop-color="#2D5BFF" />
      <stop offset="100%" stop-color="#1769AA" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <rect width="320" height="220" fill="#F4F1EA" rx="4" />
  <g stroke="#E3DDD1" stroke-width="1" stroke-dasharray="4,4">
    <line x1="0" y1="40" x2="320" y2="40" />
    <line x1="0" y1="80" x2="320" y2="80" />
    <line x1="0" y1="120" x2="320" y2="120" />
    <line x1="0" y1="160" x2="320" y2="160" />
    <line x1="0" y1="200" x2="320" y2="200" />
    <line x1="60" y1="0" x2="60" y2="220" />
    <line x1="120" y1="0" x2="120" y2="220" />
    <line x1="180" y1="0" x2="180" y2="220" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
  </g>

  <!-- Left Main Pipe Section -->
  <rect x="15" y="82" width="130" height="48" fill="url(#pipeGrad)" stroke="#111822" stroke-width="2.5" />
  <!-- Left Pipe Rib Highlights -->
  <line x1="15" y1="92" x2="145" y2="92" stroke="#9BB0C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="15" y1="118" x2="145" y2="118" stroke="#1A222B" stroke-width="3" opacity="0.8"/>

  <!-- Right Main Pipe Section -->
  <rect x="175" y="82" width="130" height="48" fill="url(#pipeGrad)" stroke="#111822" stroke-width="2.5" />
  <!-- Right Pipe Rib Highlights -->
  <line x1="175" y1="92" x2="305" y2="92" stroke="#9BB0C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="175" y1="118" x2="305" y2="118" stroke="#1A222B" stroke-width="3" opacity="0.8"/>

  <!-- Left Flange Ring -->
  <rect x="135" y="70" width="16" height="72" rx="3" fill="url(#flangeGrad)" stroke="#111822" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Bolts on Left Flange -->
  <circle cx="143" cy="78" r="3.5" fill="#C5D3E3" stroke="#111822" stroke-width="1.5" />
  <circle cx="143" cy="106" r="3.5" fill="#C5D3E3" stroke="#111822" stroke-width="1.5" />
  <circle cx="143" cy="134" r="3.5" fill="#C5D3E3" stroke="#111822" stroke-width="1.5" />

  <!-- Right Flange Ring -->
  <rect x="169" y="70" width="16" height="72" rx="3" fill="url(#flangeGrad)" stroke="#111822" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Bolts on Right Flange -->
  <circle cx="177" cy="78" r="3.5" fill="#C5D3E3" stroke="#111822" stroke-width="1.5" />
  <circle cx="177" cy="106" r="3.5" fill="#C5D3E3" stroke="#111822" stroke-width="1.5" />
  <circle cx="177" cy="134" r="3.5" fill="#C5D3E3" stroke="#111822" stroke-width="1.5" />

  <!-- Damaged Joint Gap / Rupture -->
  <path d="M 151 86 Q 160 92 153 106 Q 165 116 152 128" stroke="#FF3D2E" stroke-width="3" fill="none" />
  <polygon points="152,90 159,96 156,104 163,110 155,122" fill="#E53935" opacity="0.3" />

  <!-- Active Water Spray Jet -->
  <path d="M 155 96 C 145 75 130 50 115 42 C 140 45 155 60 162 88 Z" fill="url(#waterGrad)" opacity="0.85" />
  <path d="M 158 108 C 175 118 200 135 220 155 C 195 142 175 125 156 114 Z" fill="url(#waterGrad)" opacity="0.8" />
  <path d="M 153 118 C 148 135 140 160 135 185 C 142 165 150 145 156 124 Z" fill="url(#waterGrad)" opacity="0.75" />

  <!-- Water Droplets -->
  <ellipse cx="110" cy="38" rx="3.5" ry="5" fill="#2D5BFF" transform="rotate(-25 110 38)" />
  <circle cx="95" cy="46" r="2.5" fill="#64B5F6" />
  <circle cx="125" cy="30" r="2" fill="#2D5BFF" />
  <ellipse cx="230" cy="165" rx="4" ry="6" fill="#1769AA" transform="rotate(35 230 165)" />
  <circle cx="242" cy="178" r="2.5" fill="#2D5BFF" />
  <circle cx="218" cy="180" r="3" fill="#64B5F6" />
  <ellipse cx="132" cy="192" rx="3.5" ry="5" fill="#1769AA" transform="rotate(10 132 192)" />
  <circle cx="140" cy="202" r="2" fill="#2D5BFF" />

  <!-- Ground Water Puddle Accumulation -->
  <ellipse cx="160" cy="198" rx="60" ry="8" fill="#2D5BFF" opacity="0.3" />
  <ellipse cx="160" cy="198" rx="42" ry="5" fill="#1769AA" opacity="0.4" />
  <line x1="145" y1="196" x2="175" y2="196" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Flow Direction Arrows -->
  <path d="M 45 68 L 75 68 M 70 64 L 76 68 L 70 72" stroke="#4A5D6E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="85" y="72" font-family="monospace, monospace" font-size="9" font-weight="bold" fill="#4A5D6E">HIGH PRESSURE</text>

  <!-- Status Warning Sticker -->
  <g transform="translate(185, 18)">
    <rect width="120" height="26" fill="#FF3D2E" rx="2" stroke="#111822" stroke-width="1.5" />
    <text x="60" y="17" font-family="monospace, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">⚠️ ACTIVE LEAK</text>
  </g>

  <!-- Watermark: SIMULATED DEMO -->
  <g transform="translate(15, 192)">
    <rect width="105" height="18" fill="#111822" rx="2" />
    <text x="52" y="13" font-family="monospace, sans-serif" font-size="8" font-weight="bold" fill="#F4F1EA" text-anchor="middle">SIMULATED DEMO</text>
  </g>
</svg>
