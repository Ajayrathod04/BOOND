<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" aria-label="Simulated repaired municipal water pipe illustration with sealed joint">
  <defs>
    <linearGradient id="pipeGradRep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5868" />
      <stop offset="30%" stop-color="#7B8C9E" />
      <stop offset="70%" stop-color="#3A4756" />
      <stop offset="100%" stop-color="#222B35" />
    </linearGradient>
    <linearGradient id="clampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDE6EF" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#BACAD9" />
      <stop offset="100%" stop-color="#788B9E" />
    </linearGradient>
    <linearGradient id="gasketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C343D" />
      <stop offset="100%" stop-color="#12171D" />
    </linearGradient>
    <filter id="shadowRep" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <rect width="320" height="220" fill="#F4F1EA" rx="4" />
  <g stroke="#E3DDD1" stroke-width="1" stroke-dasharray="4,4">
    <line x1="0" y1="40" x2="320" y2="40" />
    <line x1="0" y1="80" x2="320" y2="80" />
    <line x1="0" y1="120" x2="320" y2="120" />
    <line x1="0" y1="160" x2="320" y2="160" />
    <line x1="0" y1="200" x2="320" y2="200" />
    <line x1="60" y1="0" x2="60" y2="220" />
    <line x1="120" y1="0" x2="120" y2="220" />
    <line x1="180" y1="0" x2="180" y2="220" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
  </g>

  <!-- Left Main Pipe Section -->
  <rect x="15" y="82" width="130" height="48" fill="url(#pipeGradRep)" stroke="#111822" stroke-width="2.5" />
  <!-- Left Pipe Rib Highlights -->
  <line x1="15" y1="92" x2="145" y2="92" stroke="#9BB0C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="15" y1="118" x2="145" y2="118" stroke="#1A222B" stroke-width="3" opacity="0.8"/>

  <!-- Right Main Pipe Section -->
  <rect x="175" y="82" width="130" height="48" fill="url(#pipeGradRep)" stroke="#111822" stroke-width="2.5" />
  <!-- Right Pipe Rib Highlights -->
  <line x1="175" y1="92" x2="305" y2="92" stroke="#9BB0C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="175" y1="118" x2="305" y2="118" stroke="#1A222B" stroke-width="3" opacity="0.8"/>

  <!-- Rubber Gasket Ring Borders under clamp -->
  <rect x="126" y="74" width="6" height="64" fill="url(#gasketGrad)" stroke="#111822" stroke-width="1.5" />
  <rect x="188" y="74" width="6" height="64" fill="url(#gasketGrad)" stroke="#111822" stroke-width="1.5" />

  <!-- Heavy Duty Mechanical Repair Sleeve Clamp -->
  <rect x="130" y="72" width="60" height="68" rx="4" fill="url(#clampGrad)" stroke="#111822" stroke-width="2.5" filter="url(#shadowRep)" />
  
  <!-- Clamp Center Sealing Band -->
  <rect x="154" y="72" width="12" height="68" fill="#A8BACB" stroke="#111822" stroke-width="1.5" opacity="0.6" />

  <!-- Heavy Torque Hex Bolts on Clamp Top and Bottom -->
  <g transform="translate(138, 77)">
    <circle cx="0" cy="0" r="4.5" fill="#5A6D80" stroke="#111822" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#E2EBF2" />
  </g>
  <g transform="translate(182, 77)">
    <circle cx="0" cy="0" r="4.5" fill="#5A6D80" stroke="#111822" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#E2EBF2" />
  </g>
  <g transform="translate(138, 106)">
    <circle cx="0" cy="0" r="4.5" fill="#5A6D80" stroke="#111822" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#E2EBF2" />
  </g>
  <g transform="translate(182, 106)">
    <circle cx="0" cy="0" r="4.5" fill="#5A6D80" stroke="#111822" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#E2EBF2" />
  </g>
  <g transform="translate(138, 135)">
    <circle cx="0" cy="0" r="4.5" fill="#5A6D80" stroke="#111822" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#E2EBF2" />
  </g>
  <g transform="translate(182, 135)">
    <circle cx="0" cy="0" r="4.5" fill="#5A6D80" stroke="#111822" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#E2EBF2" />
  </g>

  <!-- Inspection Seal Stamp / Tag on Pipe -->
  <rect x="70" y="94" width="48" height="24" rx="2" fill="#EAF7EC" stroke="#00A86B" stroke-width="1.5" />
  <text x="94" y="105" font-family="monospace, sans-serif" font-size="7" font-weight="900" fill="#008050" text-anchor="middle">SEALED</text>
  <text x="94" y="114" font-family="monospace, sans-serif" font-size="6.5" font-weight="bold" fill="#333333" text-anchor="middle">TORQUE OK</text>

  <!-- Dry Ground Baseline (No Puddles) -->
  <line x1="60" y1="198" x2="260" y2="198" stroke="#D1C8B8" stroke-width="2" stroke-linecap="round" />
  <text x="160" y="211" font-family="monospace, sans-serif" font-size="8" font-weight="bold" fill="#887C68" text-anchor="middle">DRY GROUND SURFACE · NO LEAK</text>

  <!-- Flow Direction Arrows -->
  <path d="M 45 68 L 75 68 M 70 64 L 76 68 L 70 72" stroke="#00A86B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="85" y="72" font-family="monospace, monospace" font-size="9" font-weight="bold" fill="#008050">NORMAL FLOW (PRESSURIZED)</text>

  <!-- Status Success Sticker -->
  <g transform="translate(180, 18)">
    <rect width="125" height="26" fill="#00A86B" rx="2" stroke="#111822" stroke-width="1.5" />
    <text x="62" y="17" font-family="monospace, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">✓ REPAIRED JOINT</text>
  </g>

  <!-- Watermark: SIMULATED DEMO -->
  <g transform="translate(15, 192)">
    <rect width="105" height="18" fill="#111822" rx="2" />
    <text x="52" y="13" font-family="monospace, sans-serif" font-size="8" font-weight="bold" fill="#F4F1EA" text-anchor="middle">SIMULATED DEMO</text>
  </g>
</svg>
